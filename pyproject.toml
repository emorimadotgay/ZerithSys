[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerithsys"
version = "1.0.0"
description = "A modern, real-time system monitor — what neofetch should have been"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ZerithSys Contributors"}]
keywords = ["system", "monitor", "neofetch", "tui", "textual", "dashboard", "real-time"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = [
    "textual>=0.50.0",
    "psutil>=5.9.5",
    "py-cpuinfo>=9.0.0",
    "rich>=13.5.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
smart = ["py-smart-open>=0.0.2"]   # optional: for SMART disk temps
dev = [
    "build>=0.10.0",
    "setuptools>=61.0",
    "wheel",
    "twine>=4.0.0",
]

[project.scripts]
zerithsys = "main:main"

[project.urls]
Homepage   = "https://github.com/zerithsys/zerithsys"
Issues     = "https://github.com/zerithsys/zerithsys/issues"
Changelog  = "https://github.com/zerithsys/zerithsys/blob/main/CHANGELOG.md"

# ── package discovery ────────────────────────────────────────────────────────
[tool.setuptools]
py-modules  = ["main"]
packages    = ["modules"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.tcss", "*.md"]
